name: Build VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out plugin repository
        uses: actions/checkout@v4

      - name: Check out VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          path: vst3sdk
          submodules: recursive

      - name: Verify project and SDK files
        run: |
          python -c "from pathlib import Path; p=Path('PsyGoa_NebulaFX_VST3/CMakeLists.txt'); print(f'Found {p}' if p.is_file() else 'ERROR: Project CMakeLists.txt is missing'); raise SystemExit(0 if p.is_file() else 1)"
          python -c "from pathlib import Path; p=Path('vst3sdk/CMakeLists.txt'); print(f'Found {p}' if p.is_file() else 'ERROR: VST3 SDK is missing at vst3sdk/'); raise SystemExit(0 if p.is_file() else 1)"

      - name: Configure
        run: cmake -S PsyGoa_NebulaFX_VST3 -B build -DVST3_SDK_ROOT="${{ github.workspace }}/vst3sdk"

      - name: Build
        run: cmake --build build --config Release --parallel
